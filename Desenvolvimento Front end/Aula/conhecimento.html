<!DOCTYPE html>
<html>

<head>
    <title>Campos do Formulário</title>
</head>

<body>

    <form>

        <h2>Cadastro</h2>

        Nome completo:
        <input type="text" name="nome" placeholder="Seu nome completo"><br><br>

        E-mail:
        <input type="email" name="email" placeholder="exemplo@dominio.com"><br><br>

        Senha:
        <input type="password" name="senha"><br><br>

        Idade:
        <input type="number" name="idade"><br><br>

        Data de nascimento:
        <input type="date" name="data"><br><br>

        Site pessoal:
        <input type="url" name="site"><br><br>

        Cor favorita:
        <input type="color" name="cor"><br><br>

        Aceito os termos:
        <input type="checkbox" name="termos"><br><br>

        Gênero:

        <input type="radio" name="genero" value="M">
        Masculino

        <input type="radio" name="genero" value="F">
        Feminino

        <input type="radio" name="genero" value="O">
        Outro

        <br><br>

        Comentários:
        <textarea name="comentarios" rows="5" cols="45"></textarea>

        <br><br>

        <input type="submit" value="Enviar">

    </form>

</body>

</html>
